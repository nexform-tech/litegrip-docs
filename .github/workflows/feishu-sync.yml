# 仓库里的 PDF 更新后，把飞书文档中心的同名文件块换成新版本。
#
# 触发条件是默认分支上 PDF 或同步脚本本身有变动。飞书那边只替换文件内容，
# 文档里的块位置和 PDF 之前的分享权限都保持不变。
#
# 需要的仓库 secrets：
#   FEISHU_APP_ID、FEISHU_APP_SECRET —— 自建应用凭据。
# 该应用必须已经通过「文档 → … → …更多 → 添加文档应用」被加进目标文档，
# 且角色为可编辑，否则调用会返回 1770032 forBidden。
name: Feishu PDF Sync

on:
  push:
    branches:
      - main
    paths:
      - "*.pdf"
      - "drawings/*.pdf"
      - "scripts/feishu_sync.py"
      - "scripts/feishu_sync.json"
      - ".github/workflows/feishu-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feishu-sync
  cancel-in-progress: false # 两次同步并行会互相覆盖文件块

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync PDFs to Feishu
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: python3 scripts/feishu_sync.py
